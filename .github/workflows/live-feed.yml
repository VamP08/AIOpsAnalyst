name: live-feed

# Triages whatever the watched repositories posted in the last day and commits
# the result. The evaluation corpus is deliberately untouched: a scorecard that
# moves when a stranger opens an issue is not a measurement. What this proves is
# that the pipeline still runs, and the commit history is the proof.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-feed
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # no embeddings extra on purpose: a couple of dozen issues do not justify
      # pulling PyTorch into a scheduled job, and the feed falls back to
      # lexical clustering with a note in the log
      - run: pip install -e ".[cluster]"
      - name: triage recent issues
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python eval/live_feed.py demo/public/data/live.json
      - name: commit the feed if it changed
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add demo/public/data/live.json
          git diff --staged --quiet || git commit -m "live feed: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
