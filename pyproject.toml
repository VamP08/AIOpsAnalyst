[project]
name = "aiopsanalyst"
version = "0.1.0"
description = "Source-agnostic event triage: one pipeline from logs, issues and alerts to categorized, evidence-linked actions"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cluster = [
    "drain3>=0.9.11",
    "datasketch>=1.6",
    "sentence-transformers>=3.0",
]
server = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aiops", "aiops.sources", "aiops.cluster", "aiops.triage", "aiops.sinks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
