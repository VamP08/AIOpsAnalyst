[project]
name = "aiopsanalyst"
version = "1.0.1"
description = "Source-agnostic event triage: one pipeline from logs, issues and alerts to categorized, evidence-linked actions"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cluster = [
    "drain3>=0.9.11",
    "datasketch>=1.6",
]
embeddings = [
    "sentence-transformers>=3.0",
]
server = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aiops", "aiops.sources", "aiops.cluster", "aiops.triage",
            "aiops.sinks", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
